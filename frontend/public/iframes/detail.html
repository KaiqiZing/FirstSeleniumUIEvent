<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>单据详情</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f7fa; padding: 24px; }
    .card { max-width: 560px; margin: 20px auto; background: #fff; border: 1px solid #e5e6eb; border-radius: 12px; padding: 22px 26px; }
    h2 { margin: 0 0 4px; font-size: 17px; }
    .no { color: #86909c; font-size: 12px; margin: 0 0 16px; }
    .kv { display: flex; padding: 9px 0; border-bottom: 1px dashed #eef0f3; font-size: 13px; }
    .kv dt { width: 120px; color: #86909c; }
    .kv dd { margin: 0; color: #1f2329; }
    .tag { color: #1d39c4; background: #f0f5ff; border: 1px solid #d6e4ff; padding: 2px 8px; border-radius: 20px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">销售单据详情</h2>
    <p class="no" id="billNo">单号：读取中…</p>
    <dl>
      <div class="kv"><dt>客户名称</dt><dd id="cust">华东-直营店</dd></div>
      <div class="kv"><dt>单据金额</dt><dd id="amount">¥ 2,680.00</dd></div>
      <div class="kv"><dt>单据状态</dt><dd><span class="tag" id="state">待确认</span></dd></div>
      <div class="kv"><dt>开单时间</dt><dd id="time">—</dd></div>
    </dl>
  </div>
  <script>
    var id = new URLSearchParams(location.search).get('id') || 'D-0000';
    document.getElementById('billNo').textContent = '单号：' + id;
    document.getElementById('time').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
    document.title = '单据详情 ' + id;
  </script>
</body>
</html>
