<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>二级框架 - 费用报销单</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f8f9ff; padding: 16px; }
    .wrap { border: 1px solid #d6dbe6; border-radius: 10px; background: #fff; padding: 16px; }
    h4 { margin: 0 0 4px; color: #1f2329; }
    .tip { color: #86909c; font-size: 12px; margin: 0 0 14px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: #4e5969; margin-bottom: 6px; }
    input, select {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #c9cdd4; border-radius: 6px; font-size: 13px; outline: none;
    }
    .actions { margin-top: 6px; display: flex; gap: 10px; }
    button {
      border: 1px solid #2f54eb; background: #2f54eb; color: #fff;
      border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    button.ghost { background: #fff; color: #2f54eb; }
    .state { margin-top: 12px; font-size: 13px; color: #4e5969; }
  </style>
</head>
<body>
  <div class="wrap">
    <h4>二级框架：费用报销单</h4>
    <p class="tip">本表单位于第二层 iframe 内部</p>
    <div class="field">
      <label for="reason">报销事由</label>
      <input id="reason" type="text" placeholder="请输入报销事由" />
    </div>
    <div class="field">
      <label for="amount">报销金额（元）</label>
      <input id="amount" type="number" placeholder="0.00" />
    </div>
    <div class="field">
      <label for="dept">报销部门</label>
      <select id="dept">
        <option value="">请选择部门</option>
        <option value="R&D">研发中心</option>
        <option value="SALES">销售部</option>
        <option value="FIN">财务部</option>
      </select>
    </div>
    <div class="actions">
      <button type="button" id="submitBtn">提交报销单</button>
      <button type="button" class="ghost" id="resetBtn">重置</button>
    </div>
    <p class="state" id="stateLine">单据状态：未提交</p>
  </div>
  <script>
    var stateLine = document.getElementById('stateLine');
    document.getElementById('submitBtn').addEventListener('click', function () {
      var reason = document.getElementById('reason').value || '（未填事由）';
      var amount = document.getElementById('amount').value || '0';
      var no = 'RB' + new Date().toLocaleTimeString('zh-CN', { hour12: false }).replace(/:/g, '');
      stateLine.textContent = '单据状态：已提交，单号 ' + no + '，事由「' + reason + '」，金额 ' + amount;
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'FRAME_B_SUBMIT', reason: reason, amount: amount, no: no }, '*');
      }
    });
    document.getElementById('resetBtn').addEventListener('click', function () {
      document.getElementById('reason').value = '';
      document.getElementById('amount').value = '';
      stateLine.textContent = '单据状态：已重置';
    });
  </script>
</body>
</html>
